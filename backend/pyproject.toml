[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tezlify-studio"
version = "1.0.0"
description = "Tezlify AI Video Studio - Clean Architecture Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "platformdirs>=4.2.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

